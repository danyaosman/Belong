services:

  db:
    image: postgres:16
    container_name: belong-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend

    container_name: belong-backend

    depends_on:
      - db

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://belong:belong123@db:5432/belong
    ports:
      - "${BACKEND_PORT}:8000"

    volumes:
      - ./backend:/app
      - ./assets:/app/assets

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

volumes:
  postgres_data: